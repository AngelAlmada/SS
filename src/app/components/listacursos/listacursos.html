<div class="lista-cursos">
  <ul>
    @for (curso of cursos; track curso) {
      <li>
        <img [src]="curso.imagenPath" [alt]="curso.titulo" />
        <div class="descripcion">
          <h2>{{ curso.titulo }}</h2>
        </div>

        <button [routerLink]="['/registrocurso', curso.titulo]">
          Inscribirse
        </button>
      </li>
    }
  </ul>
</div>
