<div class="wrapper">
  <div class="container">
    <div class="container-cards" *ngFor="let curso of cursos">
      <div class="image-container">
        <img [src]="curso.imagenPath" [alt]="curso.titulo" loading="lazy">
      </div>
      <div class="info">
        <h2 class="curso-titulo">{{ curso.titulo }}</h2>
        <p class="curso-fecha">Inicia: {{ curso.fecha }}</p>
      </div>
      <button class="btn-inscribirse" [routerLink]="['/registrocurso', curso.titulo]">
        <span class="btn-text">Inscribirse</span>
        <span class="btn-icon">→</span>
      </button>
    </div>
  </div>
</div>
