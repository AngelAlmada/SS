<div class="page-container">
  <app-componenteprincipal
  *ngIf="current() as curso"
  [icono]="curso.imagenPath"
  [titulo]="curso.titulo"
  [contenido]="curso.descripcion"
  [fechaCurso]="'Inicia el ' + (curso.fecha[0] | date:'d \'de\' MMMM, y')"
></app-componenteprincipal>

  <app-listacursos [cursos]="cursos"></app-listacursos>
</div>
